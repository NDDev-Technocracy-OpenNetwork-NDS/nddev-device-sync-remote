[package]
name = "nddev-device-sync-remote"
version = "0.0.1-alpha.2"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-remote"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "f0e21ef6cab88958479de142370179b779beb2fe" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

# Checked provider inputs must be applied at the final consumer Cargo root.
[features]
owned-screen = ["dep:nddev-device-sync-domain", "dep:nddev-device-sync-application", "dep:rds-core", "dep:rds-net", "dep:rds-client", "dep:rds-desktop", "dep:anyhow", "dep:postcard", "dep:rand", "dep:iroh", "dep:tokio", "dep:tokio-util", "dep:tracing"]

[target.'cfg(target_os = "linux")'.dependencies]
nddev-device-sync-domain = { version = "=0.0.12", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "088e658126c7aabe637b782c1a152f90fce0b47f", optional = true }
nddev-device-sync-application = { version = "=0.0.1-alpha.21", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "088e658126c7aabe637b782c1a152f90fce0b47f", optional = true }
rds-core = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false, optional = true }
rds-net = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false, optional = true }
rds-client = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false, optional = true }
rds-desktop = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false, features = ["x11"], optional = true }
anyhow = { version = "1", optional = true }
# Same checked native transport type, for enum-only read limit mapping.
iroh = { version = "=1.3.0", default-features = false, optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
rand = { version = "0.10", optional = true }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.14"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
